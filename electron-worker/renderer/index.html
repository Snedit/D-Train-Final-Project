<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ML Worker</title>
    <style>
      body { font-family: sans-serif; margin: 0; padding: 0; }
      #top { display: flex; padding: 10px; background: #222; color: #eee; }
      #status { flex: 1; }
      #controls { flex: 1; text-align: right; }
      #logs { height: 300px; overflow-y: auto; background: #111; color: #0f0; padding: 10px; font-family: monospace; }
      #metrics { padding: 10px; }
    </style>
  </head>
  <body>
    <div id="top">
      <div id="status">
        <div>Worker Status: <span id="workerState">Unknown</span></div>
        <div>Current Job: <span id="currentJob">None</span></div>
      </div>
      <div id="controls">
        <button id="startBtn">Start</button>
        <button id="stopBtn">Stop</button>
      </div>
    </div>
    <div id="metrics">
      CPU: <span id="cpuPercent">0</span>% | MEM: <span id="memUsage">0</span>
    </div>
    <div id="logs"></div>
    <script src="renderer.js"></script>
  </body>
</html>
